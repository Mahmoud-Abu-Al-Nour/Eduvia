# ─────────────────────────────────────────────────────────────────────────────
#  Eduvia — Docker Compose (Local Development)
#
#  Services:
#    frontend  → Vite dev server (http://localhost:5173)
#    backend   → FastAPI + Uvicorn (http://localhost:8000)
#    postgres  → PostgreSQL 16 (localhost:5432)
#    qdrant    → Qdrant vector DB (http://localhost:6333)
#
#  Usage:
#    cp .env.example .env
#    # Edit .env with your real values
#    docker compose up
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eduvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-eduvia_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduvia} -d ${POSTGRES_DB:-eduvia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eduvia-network

  # ── Qdrant ─────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: eduvia-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - eduvia-network

  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: eduvia-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override database URL to use Docker service hostname
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eduvia}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eduvia_db}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./backend:/app
      - /app/.venv  # Preserve virtualenv from build
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - eduvia-network

  # ── Frontend (Vite) ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: eduvia-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Preserve node_modules from build
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - eduvia-network

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  eduvia-network:
    driver: bridge
