[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eduvia-mcp"
version = "0.1.0"
description = "Local developer MCP server for Eduvia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
eduvia-mcp = "eduvia_mcp.__main__:main"
